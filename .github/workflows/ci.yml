---
name: CI

on:
  # Pre-PR feedback on work branches. This list is a convenience, not the gate —
  # it depends on branch naming, and a namespace nobody thought to register here
  # silently gets nothing (that is how `verify/**` went uncovered).
  push:
    branches:
      - main
      - devel
      - feat/**
      - feature/**
      - fix/**
      - chore/**
      - verify/**
  # The actual gate: nothing reaches an integration branch through a PR without
  # a run, regardless of what the source branch is called. `devel` is listed for
  # exactly the case that got through — a `verify/**` -> `devel` PR matched
  # neither trigger, so a broken MANIFEST.sha256 merged unaudited (#23, caught
  # only by the `devel` push run afterwards and then by the release PR #24).
  # Cost of this: a `feature/**` -> `devel` PR now runs twice, once per event.
  # Paying ~3 CI-minutes for a gate that does not depend on naming discipline.
  pull_request:
    branches:
      - main
      - devel

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export host UID/GID for docker compose
        run: |
          echo "UID=$(id -u)" >> "$GITHUB_ENV"
          echo "GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Pre-create bind-mount directories owned by the runner user
        run: mkdir -p p_venv .pip-cache

      - name: Build Docker images
        run: make build

      - name: Start builder container
        run: docker compose up -d builder

      - name: Generate and check requirements.txt for drift
        run: |
          make infra.deps
          git diff --exit-code requirements.txt

      - name: Verify repository manifest
        run: make manifest-verify

      # The committed WASM artifact must be checked as it is in the checkout, BEFORE
      # any step rebuilds module/module.wasm or rewrites buildHash (`make wasm.build`
      # below does both). After that step the check would only compare files that
      # were just created together (issue #37).
      - name: Verify committed WASM artifact integrity (hash == buildHash, before any build)
        run: make wasm.integrity-verify

      # Build the guest fresh to a scratch path (the tracked module.wasm and
      # project.yaml are not touched) and require the real-WASM Call tests to PASS
      # against it. These tests skip when CIC_MODULE_WASM_PATH is unset, so the
      # plain `make wasm.test` below does not run them.
      - name: Fresh guest - build to a scratch path and require the real-WASM tests to pass
        run: make wasm.test-fresh

      - name: Check internal documentation links
        run: make docs.link-check

      - name: Run code quality checks
        run: make check

      - name: Run Go quality gate (module/)
        run: make golang.quality

      - name: Test the OCI schema extractor (tools/oci-extract)
        run: make oci.extract.test

      - name: Build WASM guest module (TinyGo)
        run: make wasm.build

      - name: WASM reproducibility probe (non-fatal, issue #2)
        run: make wasm.repro-probe

      - name: Host-load test against the relay cabinet ABI
        run: make wasm.test

      - name: Run tests and generate coverage report
        run: make test

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: htmlcov/
